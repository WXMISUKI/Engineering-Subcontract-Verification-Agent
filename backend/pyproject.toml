requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.124.4",
  "uvicorn[standard]==0.49.0",
  "sqlalchemy==2.0.36",
  "pymysql==1.1.1",
  "python-jose[cryptography]==3.3.0",
  "bcrypt==4.0.1",
  "slowapi==0.1.10",
  "python-multipart==0.0.27",
  "httpx==0.28.1",
  "openai==2.48.0",
  "opencv-python==5.0.0.93",
  "pymupdf==1.28.0",
  "pypdf==6.11.0",
  "python-docx==1.1.2",
  "pillow==12.3.0",
  "rapidfuzz==3.14.6",
